# HAProxy in front of copasrv and the Garage S3 API — two hostnames, HTTPS only.
#
# Check:  haproxy -c -f haproxy.cfg
#
# Presigned URLs are signed over Host + path + query. HAProxy forwards all
# three unchanged by default; do not add `http-request set-header Host`,
# `set-path` or `replace-uri` rules to the s3 backend.

global
    log stdout format raw local0
    maxconn 2048

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 5s
    # Uploads/downloads of up to max_file_size must fit in these.
    timeout client  5m
    timeout server  5m
    # WebSockets (/ws, /ws/events) stay open; keep them alive for a day.
    timeout tunnel  24h
    timeout http-request 15s

frontend https_in
    # One PEM per hostname (certificate + key) in this directory.
    bind :443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    http-response set-header Strict-Transport-Security "max-age=31536000"

    acl host_copa hdr(host) -i copa.example.com
    acl host_s3   hdr(host) -i s3.example.com

    # HAProxy streams request bodies (no buffering) and has no body-size limit
    # of its own; reject oversized uploads early instead. 64 MiB here matches
    # copa's default max_file_size of 50 MiB with headroom.
    http-request deny deny_status 413 if host_s3 { req.hdr_val(content-length) gt 67108864 }

    use_backend copa if host_copa
    use_backend s3   if host_s3
    default_backend reject

backend copa
    # copasrv listens on loopback only. WebSocket upgrades pass through as-is.
    server copasrv 127.0.0.1:8080 check

backend s3
    # Garage S3 API on loopback only (see ../docker-compose.yml).
    server garage 127.0.0.1:3900 check

backend reject
    http-request deny deny_status 404
