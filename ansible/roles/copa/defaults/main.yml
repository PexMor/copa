---
# ── what to deploy ──────────────────────────────────────────────────────────
copa_local_bin: "{{ playbook_dir }}/../bin"          # output of scripts/build-all.sh
copa_arch_map:                                         # ansible_architecture -> bin/<arch>
  x86_64: x86_64
  aarch64: arm64
  armv7l: armhf
  armv8l: armhf                                        # 32-bit OS on a 64-bit Pi
copa_binaries: [copasrv, copacli]

# ── where it goes (all under the SSH user's $HOME) ──────────────────────────
copa_home: "{{ ansible_facts['user_dir'] }}"
copa_bin_dir: "{{ copa_home }}/.local/bin"
copa_data_dir: "{{ copa_home }}/.local/share/copa"
copa_frontend_dir: "{{ copa_data_dir }}/dist"
copa_work_dir: "{{ copa_data_dir }}/work"
copa_config_dir: "{{ copa_home }}/.config/copa"
copa_config_file: "{{ copa_config_dir }}/config.toml"
copa_unit_dir: "{{ copa_home }}/.config/systemd/user"
copa_service_name: copasrv

# ── config safety ───────────────────────────────────────────────────────────
copa_config_policy: keep            # keep | install | overwrite
copa_config_overwrite_confirm: ""   # must equal inventory_hostname for `overwrite`
copa_config_source: "{{ role_path }}/../../files/config/{{ inventory_hostname }}.toml"

# ── service ─────────────────────────────────────────────────────────────────
copa_enable_linger: false           # loginctl enable-linger (survive logout / start at boot)
copa_user_runtime_dir: "/run/user/{{ ansible_facts['user_uid'] }}"

# ── optional Cloudflare cache purge (files/cloudflare.yml) ──────────────────
copa_cf_purge: false
copa_cf_file: "{{ role_path }}/../../files/cloudflare.yml"

# ── optional S3 / presigned file sharing ([server.storage]) ─────────────────
# Opt-in. Manages ONLY the [server.storage] block of an existing config.toml and a
# 0600 env file with the secret. Values come from these variables and/or files/storage.yml
# (explicit variables win). See files/storage.example.yml.
copa_storage_enabled: false
copa_storage_remove: false           # with copa_storage_enabled=false: remove block + env file
copa_storage_allow_insecure: false   # allow http:// public_url on a non-loopback host
copa_storage_file: "{{ role_path }}/../../files/storage.yml"
copa_storage_env_file: "{{ copa_config_dir }}/storage.env"
copa_storage_public_url: ""
copa_storage_endpoint: ""
copa_storage_region: ""
copa_storage_bucket: ""
copa_storage_access_key_id: ""
copa_storage_secret_access_key: ""
copa_storage_key_prefix: ""
copa_storage_presign_ttl_secs: ""
copa_storage_filevars: {}
