---
# Gate + report. Runs always (also with --check). Changes nothing on the host.
- name: Validate host role
  ansible.builtin.assert:
    that:
      - copa_role in ['server', 'client']
    fail_msg: "copa_role must be server|client (got '{{ copa_role }}'). Nothing was changed."
    quiet: true

- name: Validate config policy
  ansible.builtin.assert:
    that:
      - copa_config_policy in ['keep', 'install', 'overwrite']
      - copa_config_policy != 'overwrite' or copa_config_overwrite_confirm == inventory_hostname
    fail_msg: >-
      copa_config_policy must be keep|install|overwrite; 'overwrite' additionally needs
      -e copa_config_overwrite_confirm={{ inventory_hostname }} (explicit approval, nothing was changed).
    quiet: true

- name: Map host architecture to build arch
  ansible.builtin.assert:
    that: ansible_facts['architecture'] in copa_arch_map
    fail_msg: "Unsupported architecture '{{ ansible_facts['architecture'] }}' (supported: {{ copa_arch_map.keys() | list }})"
    quiet: true

- name: Set build arch and artifact paths
  ansible.builtin.set_fact:
    copa_arch: "{{ copa_arch_map[ansible_facts['architecture']] }}"
    copa_arch_dir: "{{ copa_local_bin }}/{{ copa_arch_map[ansible_facts['architecture']] }}"

- name: Stat local build artifacts
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: true
  delegate_to: localhost
  become: false
  check_mode: false
  loop: "{{ (copa_binaries | map('regex_replace', '^(.*)$', copa_arch_dir ~ '/\\1') | list) + [copa_local_bin ~ '/frontend/index.html'] }}"
  register: copa_local_stat

- name: Fail if build artifacts are missing
  ansible.builtin.fail:
    msg: "Missing build artifact {{ item.item }} - run `make dist` (arch {{ copa_arch }}) first."
  loop: "{{ copa_local_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists

- name: Stat local config source
  ansible.builtin.stat:
    path: "{{ copa_config_source }}"
    get_checksum: true
  delegate_to: localhost
  become: false
  check_mode: false
  no_log: true
  register: copa_src_stat

- name: Fail if the config source is required but absent
  ansible.builtin.fail:
    msg: >-
      copa_config_policy={{ copa_config_policy }} needs {{ copa_config_source | realpath }}
      (copy files/config/host.example.toml and edit it).
  when: copa_config_policy in ['install', 'overwrite'] and not copa_src_stat.stat.exists

- name: Fail if optional Cloudflare purge is requested without its file
  ansible.builtin.stat:
    path: "{{ copa_cf_file }}"
  delegate_to: localhost
  become: false
  register: copa_cf_stat
  failed_when: copa_cf_purge | bool and not copa_cf_stat.stat.exists
  when: copa_cf_purge | bool

- name: Stat remote state (config, frontend, work dir, unit, binary)
  ansible.builtin.stat:
    path: "{{ item.path }}"
    get_checksum: "{{ item.sum | default(false) }}"
  check_mode: false
  loop:
    - { key: config,   path: "{{ copa_config_file }}", sum: true }
    - { key: frontend, path: "{{ copa_frontend_dir }}/index.html" }
    - { key: workdir,  path: "{{ copa_work_dir }}" }
    - { key: unit,     path: "{{ copa_unit_dir }}/{{ copa_service_name }}.service" }
    - { key: binary,   path: "{{ copa_bin_dir }}/copasrv" }
    - { key: bus,      path: "{{ copa_user_runtime_dir }}/bus" }
    - { key: storage_env, path: "{{ copa_storage_env_file }}" }
  loop_control:
    label: "{{ item.key }}"
  register: copa_remote_stat
  no_log: true   # config checksum only; labels shown via report below

- name: Query user lingering
  ansible.builtin.command: "loginctl show-user {{ ansible_facts['user_id'] }} -p Linger --value"
  register: copa_linger
  changed_when: false
  failed_when: false
  check_mode: false

- name: Index remote stat and remember config checksum
  ansible.builtin.set_fact:
    copa_rs: "{{ dict(copa_remote_stat.results | map(attribute='item.key') | zip(copa_remote_stat.results | map(attribute='stat'))) }}"
  no_log: true

# ── optional storage ([server.storage]) ────────────────────────────────────
- name: Stat local storage settings file
  ansible.builtin.stat:
    path: "{{ copa_storage_file }}"
  delegate_to: localhost
  become: false
  check_mode: false
  register: copa_storage_file_stat
  when: copa_storage_enabled | bool

- name: Load local storage settings file
  ansible.builtin.include_vars:
    file: "{{ copa_storage_file }}"
    name: copa_storage_filevars
  delegate_to: localhost
  no_log: true
  when: copa_storage_enabled | bool and copa_storage_file_stat.stat.exists

- name: Resolve effective storage settings (explicit variables win over the file)
  ansible.builtin.set_fact:
    copa_st:
      public_url:        "{{ copa_storage_public_url        or (copa_storage_filevars.public_url | default('')) }}"
      endpoint:          "{{ copa_storage_endpoint          or (copa_storage_filevars.endpoint | default('')) }}"
      region:            "{{ copa_storage_region            or (copa_storage_filevars.region | default('')) }}"
      bucket:            "{{ copa_storage_bucket            or (copa_storage_filevars.bucket | default('')) }}"
      access_key_id:     "{{ copa_storage_access_key_id     or (copa_storage_filevars.access_key_id | default('')) }}"
      secret_access_key: "{{ copa_storage_secret_access_key or (copa_storage_filevars.secret_access_key | default('')) }}"
      key_prefix:        "{{ copa_storage_key_prefix        or (copa_storage_filevars.key_prefix | default('')) }}"
      presign_ttl_secs:  "{{ copa_storage_presign_ttl_secs  or (copa_storage_filevars.presign_ttl_secs | default('')) }}"
  no_log: true

- name: Validate storage mode flags
  ansible.builtin.assert:
    that: not (copa_storage_enabled | bool and copa_storage_remove | bool)
    fail_msg: "copa_storage_remove=true requires copa_storage_enabled=false (nothing was changed)."
    quiet: true

- name: Validate storage settings
  ansible.builtin.assert:
    that:
      - copa_st.public_url | length > 0
      - copa_st.public_url is match('^https?://[^/\s]+')
      - copa_st.bucket | length > 0
      - copa_st.access_key_id | length > 0
      - copa_st.secret_access_key | length > 0
      - "'\n' not in copa_st.secret_access_key and '\r' not in copa_st.secret_access_key"
      - copa_st.key_prefix == '' or (copa_st.key_prefix | trim | length > 0)
      - copa_st.presign_ttl_secs == '' or (copa_st.presign_ttl_secs | string is match('^[0-9]+$') and 1 <= (copa_st.presign_ttl_secs | int) <= 604800)
      - >-
        copa_st.public_url is match('^https://')
        or copa_storage_allow_insecure | bool
        or copa_st.public_url is match('^http://(127\.0\.0\.1|localhost|\[::1\])([:/]|$)')
    fail_msg: >-
      Invalid storage settings: public_url (http[s]://host), bucket, access_key_id and
      secret_access_key are required; key_prefix must not be blank; presign_ttl_secs must be
      1-604800; a non-loopback http:// public_url needs copa_storage_allow_insecure=true
      (prefer https). Nothing was changed.
    quiet: true
  no_log: true
  when: copa_storage_enabled | bool

- name: Read remote config for storage checks
  ansible.builtin.slurp:
    src: "{{ copa_config_file }}"
  register: copa_cfg_slurp
  check_mode: false
  no_log: true
  when: (copa_storage_enabled | bool or copa_storage_remove | bool) and copa_rs.config.exists

- name: Inspect [server.storage] in remote config
  ansible.builtin.set_fact:
    copa_storage_block_present: "{{ '# BEGIN ANSIBLE MANAGED [server.storage]' in copa_cfg_text }}"
    copa_storage_unmanaged: >-
      {{ (copa_cfg_text | regex_replace('(?s)# BEGIN ANSIBLE MANAGED \[server\.storage\].*?# END ANSIBLE MANAGED \[server\.storage\]', ''))
         is search('(?m)^\s*\[\s*server\s*\.\s*storage\s*\]') }}
  vars:
    copa_cfg_text: "{{ (copa_cfg_slurp.content | b64decode) if copa_cfg_slurp.content is defined else '' }}"
  no_log: true

- name: Fail on an unmanaged [server.storage] section
  ansible.builtin.fail:
    msg: >-
      {{ copa_config_file }} already has a hand-written [server.storage] section. Remove it (or
      wrap it in the '# BEGIN/END ANSIBLE MANAGED [server.storage]' markers) and rerun.
      Nothing was changed.
  when: (copa_storage_enabled | bool or copa_storage_remove | bool) and copa_storage_unmanaged | default(false) | bool

- name: Preflight report
  ansible.builtin.debug:
    msg:
      - "role:       {{ copa_role }}{{ '' if copa_is_server | bool else ' (service will NOT be enabled/started)' }}"
      - "arch:       {{ ansible_facts['architecture'] }} -> {{ copa_arch }}"
      - "config:     {{ copa_config_file }} {{ 'EXISTS' if copa_rs.config.exists else 'MISSING' }} (policy={{ copa_config_policy }})"
      - "frontend:   {{ copa_frontend_dir }} {{ 'present' if copa_rs.frontend.exists else 'missing' }}"
      - "work dir:   {{ copa_work_dir }} {{ 'present' if copa_rs.workdir.exists else 'missing' }}"
      - "unit:       {{ copa_unit_dir }}/{{ copa_service_name }}.service {{ 'present' if copa_rs.unit.exists else 'missing' }}"
      - "binary:     {{ copa_bin_dir }}/copasrv {{ 'present' if copa_rs.binary.exists else 'missing' }}"
      - "user bus:   {{ 'available' if copa_rs.bus.exists else 'NOT running (no active user session)' }}"
      - "linger:     {{ copa_linger.stdout | default('unknown') | trim or 'unknown' }}"
      - "storage:    {{ 'ENABLED' if copa_storage_enabled | bool else ('REMOVE requested' if copa_storage_remove | bool else 'off') }}; managed block {{ 'present' if copa_storage_block_present | default(false) | bool else 'absent/unchecked' }}; env file {{ 'present' if copa_rs.storage_env.exists else 'missing' }}"
