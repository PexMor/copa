[project]
name = "token-issuer"
version = "0.1.0"
description = "Independent token service for testing the copa widget (popup login, JWKS, refresh, fault injection)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "configargparse>=1.9.0",
    "pyjwt[crypto]>=2.15.1",
]

[project.scripts]
token-issuer = "token_issuer.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
